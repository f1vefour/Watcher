; watcher.ini - auto-sort files dropped on the Desktop into folders
; named after their extension. Skips .part, .lnk, and .link files
; (and anything with no extension) so in-progress downloads and
; shortcuts are left alone.
;
; NOTE: assumed path is /home/f1vefour/Desktop -- if your username
; differs, update the "watch =" line below.
;
; Usage:
;   sudo ./watcher -c /path/to/watcher.ini debug     ; test in foreground first
;   sudo ./watcher -c /path/to/watcher.ini start      ; then run as a daemon

[DEFAULT]
logfile = /var/log/watcher.log
pidfile = /var/run/watcher.pid

[desktop_sort]
watch = /home/f1vefour/Desktop
events = write_close,move_to
; only watch the top level of the Desktop, not folders already sorted into it
recursive = false
autoadd = false
; never re-trigger on files inside the destination folders themselves
; (recursive=false already prevents that, this is just belt-and-suspenders
; in case recursive is ever turned on later)
excluded =
command = f=$filename; b=$(basename -- "$f"); ext="${b##*.}"; case "$b" in *.part|*.lnk|*.link) exit 0;; esac; if [ "$ext" = "$b" ]; then exit 0; fi; ext=$(echo "$ext" | tr '[:upper:]' '[:lower:]'); dest="/home/f1vefour/Desktop/$ext"; mkdir -p "$dest"; [ -f "$f" ] && mv -n -- "$f" "$dest/"
