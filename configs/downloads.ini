; watcher.ini - auto-sort files dropped into Downloads into folders
; named after their extension. Skips .part, .crdownload, .lnk, and
; .link files (in-progress downloads and shortcuts), and anything
; with no extension.
;
; NOTE: assumed path is /home/f1vefour/Downloads -- if your username
; differs, update the "watch =" line below.
;
; Usage:
;   sudo ./watcher -c /path/to/watcher.ini debug     ; test in foreground first
;   sudo ./watcher -c /path/to/watcher.ini start      ; then run as a daemon

[DEFAULT]
logfile = /var/log/watcher.log
pidfile = /var/run/watcher.pid

[downloads_sort]
watch = /home/f1vefour/Downloads
events = write_close,move_to
; only watch the top level of Downloads, not folders already sorted into it
recursive = false
autoadd = false
excluded =
command = f=$filename; b=$(basename -- "$f"); ext="${b##*.}"; case "$b" in *.part|*.lnk|*.link|*.crdownload) exit 0;; esac; if [ "$ext" = "$b" ]; then exit 0; fi; ext=$(echo "$ext" | tr '[:upper:]' '[:lower:]'); dest="/home/f1vefour/Downloads/$ext"; mkdir -p "$dest"; [ -f "$f" ] && mv -n -- "$f" "$dest/"
